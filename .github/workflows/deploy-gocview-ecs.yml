# Deploy gocview to ECS/ECR with Jira change ticket (CloudTrail traceability).
#
# Setup (repo admin):
#   1. GitHub → Settings → Secrets → AWS_DEPLOY_ROLE_ARN (IAM role for OIDC)
#   2. Trust policy on role for this repo + workflow
#   3. Role needs: ecr:*, ecs:RegisterTaskDefinition, ecs:UpdateService, ecs:TagResource, iam:PassRole
#
# Run: Actions → Deploy gocview ECS → Run workflow → change_ticket = SRE-1234

name: Deploy gocview ECS

on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: "Jira ticket (e.g. SRE-1234)"
        required: true
        type: string
      skip_build:
        description: "Skip Docker build (push existing local tag only — rarely used in CI)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-gocview-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-agent-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Jira ticket
        run: |
          TICKET="$(echo '${{ inputs.change_ticket }}' | tr '[:lower:]' '[:upper:]')"
          if ! echo "$TICKET" | grep -qE '^[A-Z][A-Z0-9]+-[0-9]+$'; then
            echo "Invalid change_ticket: $TICKET (expected SRE-1234)" >&2
            exit 1
          fi
          echo "CHANGE_TICKET=$TICKET" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Set up Docker Buildx
        if: inputs.skip_build != true
        uses: docker/setup-buildx-action@v3

      - name: Deploy to ECS
        env:
          CHANGE_TICKET: ${{ env.CHANGE_TICKET }}
          SYNC_AWS_CREDS_TO_ECS: "0"
          SKIP_BUILD: ${{ inputs.skip_build && '1' || '0' }}
          BUILD_PLATFORM: linux/arm64
        run: |
          chmod +x ./deploy-ecs-gocview.sh
          ./deploy-ecs-gocview.sh

      - name: Summary
        run: |
          echo "### Deploy gocview" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ticket:** ${CHANGE_TICKET}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
