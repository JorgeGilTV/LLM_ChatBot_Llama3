# Alternativa a docker-compose.prod.yml: sin env_file en la carpeta; el mismo contenido que .env
# se entrega como archivo y se monta como secreto en /run/secrets/app_env (entrypoint lo carga).
#
# Preparación (quien tenga acceso al host):
#   mkdir -p logs data
#   cp /ruta/segura/.env ./.env   # una sola vez; el archivo no se mete en la imagen
#   docker compose -f docker-compose.prod.with-secrets.yml up -d
#
# La ruta del secreto por defecto es ./.env; puedes usar otra con variable APP_ENV_FILE.

version: "3.8"

services:
  arlo-agenticai:
    image: oneview-goc-ai:latest
    container_name: arlo-agenticai-app
    ports:
      - "8080:8080"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - WEB_CONCURRENCY=2
    secrets:
      - app_env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys,requests;r=requests.get('http://127.0.0.1:8080/api/health',timeout=8);sys.exit(0 if r.ok else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - arlo-network

secrets:
  app_env:
    file: ${APP_ENV_FILE:-./.env}

networks:
  arlo-network:
    driver: bridge
