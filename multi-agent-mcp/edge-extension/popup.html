<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GocView Chatbot</title>
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="gv-header">
    <div class="gv-header-brand">
      <img src="icons/arlo-logo.png" alt="Arlo" class="gv-header-logo" />
      <div class="gv-header-text">
        <h1>GocView Chatbot</h1>
        <p class="gv-sub">Quick docs · Deep triage · Slack</p>
      </div>
    </div>
  </header>

  <main class="gv-main">
    <label class="gv-label" for="baseUrl">Server</label>
    <input id="baseUrl" type="url" class="gv-input" placeholder="https://gocview.arlocloud.com" />

    <label class="gv-label" for="query">Question</label>
    <textarea id="query" class="gv-textarea" rows="3" placeholder="What is going on with samsung?"></textarea>

    <div class="gv-btn-row">
      <button id="quickBtn" type="button" class="gv-btn gv-btn--secondary">Quick Search</button>
      <button id="deepBtn" type="button" class="gv-btn">Deep Search</button>
    </div>

    <p id="status" class="gv-status" role="status" aria-live="polite"></p>

    <div id="answer" class="gv-answer" aria-live="polite"></div>

    <p class="gv-footer-note">Powered by GocBedrock · Arlo GOC</p>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
