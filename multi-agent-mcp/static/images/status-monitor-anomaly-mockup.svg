  <rect x="40" y="96" width="100" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="90" y="118" text-anchor="middle" fill="#dc2626" font-family="system-ui,sans-serif" font-size="22" font-weight="800">1</text>
  <text x="90" y="134" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="8" font-weight="600">NEEDS ATTENTION</text>

  <rect x="152" y="96" width="100" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="202" y="118" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="22" font-weight="800">1</text>
  <text x="202" y="134" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="8" font-weight="600">PAGERDUTY OPEN</text>

  <rect x="264" y="96" width="120" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
