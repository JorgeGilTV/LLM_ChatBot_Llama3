  <text x="200" y="352" fill="#450a0a" font-family="system-ui,sans-serif" font-size="10" font-weight="800">890ms</text>

  <rect x="56" y="368" width="248" height="40" rx="6" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.5)"/>
  <text x="64" y="386" fill="#450a0a" font-family="system-ui,sans-serif" font-size="8" font-weight="700">EKS</text>
  <text x="64" y="400" fill="#7f1d1d" font-family="system-ui,sans-serif" font-size="9" font-weight="600">prod-use1-workloads-01</text>

  <!-- Pie hint -->
  <circle cx="420" cy="347" r="50" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M 420 347 L 420 297 A 50 50 0 0 1 465 360 Z" fill="#dc2626"/>
  <path d="M 420 347 L 465 360 A 50 50 0 0 1 390 385 Z" fill="#f59e0b"/>
  <path d="M 420 347 L 390 385 A 50 50 0 0 1 420 297 Z" fill="#10b981"/>
  <text x="420" y="418" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8">Pie: Critical / Warning / Healthy</text>

  <text x="360" y="492" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Static mockup &#8212; fictional data. Use /statusmonitor for live view.</text>
