        @media (max-width: 900px) { .sw-region-grid { grid-template-columns: 1fr; } }

        .sw-region-backend-block { margin-top: 0; padding: 4px 4px 6px; border: 1px solid rgba(51, 65, 85, 0.9); border-radius: 8px; background: rgba(15, 23, 42, 0.5); }
        .sw-region-backend-block--after-main { margin-top: 6px; }

        .sw-region-grid > .sw-meta { grid-column: 1 / -1; }
        .sw-tiles, .sw-tiles--region {
            --sw-tile-row-unit: 3.85rem;
            --sw-tile-col-min: 7.75rem;
            display: grid;
            grid-auto-flow: row;
            grid-auto-rows: var(--sw-tile-row-unit);
            row-gap: 0;
            column-gap: 0;
            gap: 0;
            align-items: stretch;
            grid-template-columns: repeat(auto-fill, minmax(var(--sw-tile-col-min), 1fr));
        }
        .sw-tiles--region > .sw-tile-wrap { margin: -1px; justify-self: stretch; width: 100%; max-width: none; }
        .sw-tiles > .sw-meta { grid-column: 1 / -1; }
        .sw-tile-wrap { position: relative; min-width: 0; min-height: 0; height: 100%; align-self: stretch; overflow: visible; display: flex; flex-direction: column; }
        .sw-tile-wrap--size-ok { grid-row: span 1; width: auto; max-width: 100%; }
        .sw-tile-wrap--size-ok-wide { grid-row: span 1; grid-column: span 2; width: auto; max-width: 100%; }
        .sw-tile-wrap--size-warn { grid-row: span 2; width: auto; max-width: 100%; }
        .sw-tile-wrap--size-warn-wide { grid-row: span 2; grid-column: span 2; width: auto; max-width: 100%; }
        .sw-tile-wrap--size-crit { grid-row: span 3; width: auto; max-width: 100%; }
        .sw-tile-wrap--size-crit-wide { grid-row: span 3; grid-column: span 2; width: auto; max-width: 100%; }

            overflow: hidden;

        .sw-tile-wrap--size-warn .sw-tile, .sw-tile-wrap--size-warn-wide .sw-tile { padding: 8px 9px; }
        .sw-tile-wrap--size-crit .sw-tile, .sw-tile-wrap--size-crit-wide .sw-tile { padding: 8px 10px; }
        .sw-tile-wrap--hyphen-split { max-width: 100%; }

        .sw-tile-wrap--hyphen-split.sw-tile-wrap--size-warn .sw-tile-name-scroll.sw-tile-name-hyphen-split,
        .sw-tile-wrap--hyphen-split.sw-tile-wrap--size-warn-wide .sw-tile-name-scroll.sw-tile-name-hyphen-split { font-size: 16px; }
        .sw-tile-wrap--hyphen-split.sw-tile-wrap--size-crit .sw-tile-name-scroll.sw-tile-name-hyphen-split,
        .sw-tile-wrap--hyphen-split.sw-tile-wrap--size-crit-wide .sw-tile-name-scroll.sw-tile-name-hyphen-split { font-size: 16px; }
        .sw-tile-wrap--size-ok .sw-tile, .sw-tile-wrap--size-ok-wide .sw-tile {

            width: 100%;

        /* Same rich hover panels as Status monitor */

        .sm-hover-tip-metrics {

        @keyframes sw-farola-warn {

        .sw-tile--crit { border-color: #7f1d1d; background: linear-gradient(165deg, #fca5a5 0%, #ef4444 65%, #b91c1c 100%); }

<body>
    <div class="sw-preview-banner">Preview with mock data — same layout as /statuswall. Hover a tile for details.</div>
    <header class="sw-top">
        <div class="sw-logo-section">
            <a href="/" class="sw-logo" title="Arlo"><img src="/static/images/arlo-logo.png" alt="Arlo"></a>
            <h1>Status wall (preview)</h1>
        </div>
        <button type="button" id="sw-slack" class="sw-slack-btn" title="Send mock view to Slack">📤 Slack</button>
        <span class="sw-meta">Mock · no API calls</span>
    </header>
    <main class="sw-main" id="sw-root"></main>
    <script src="/static/js/slack_share.js?v=20260326-slack-en-blocks"></script>
    <script>
        let wallTipGlobalsBound = false;
        function resetWallTipInlineStyles(tip) {
            tip.classList.remove('sm-hover-tip--visible');
            tip.style.removeProperty('display');
            tip.style.removeProperty('visibility');
            tip.style.removeProperty('position');
            tip.style.removeProperty('left');
            tip.style.removeProperty('top');
            tip.style.removeProperty('transform');

                const t = ev.target.closest('[data-href]');
                if (!t || !chips.contains(t)) return;
                const h = t.getAttribute('data-href');
                if (!h) return;
                ev.preventDefault();
                ev.stopPropagation();
                window.open(h, '_blank', 'noopener');
            });
            tileEl.appendChild(chips);
        }
        function appendMonitorPills(head, monitors) {
            if (!monitors || typeof monitors !== 'object') return;
            const cluster = document.createElement('div');
            cluster.className = 'sw-monitor-cluster';
            ['pagerduty', 'splunk'].forEach(function (k) {
                const m = monitors[k];
                if (!m || !m.label) return;
                const pill = document.createElement('span');
                pill.className = 'sw-monitor-pill sw-monitor-pill--' + (m.status || 'unknown');
                pill.title = m.detail || '';
                pill.textContent = m.label + ': ' + (m.short != null ? m.short : '');
                cluster.appendChild(pill);
            });
            head.appendChild(cluster);
        }
        function splitServicesBknd(services) {
            const main = [];
            const backend = [];
            for (const s of services || []) {
                const raw = String(s.service || '').trim();
                const disp = swTileServiceLabel(raw).toLowerCase();
                if (disp.startsWith('bknd-')) backend.push(s);
                else main.push(s);
            }
            return { main: main, backend: backend };
        }
        function swCssWidthToPx(cssLen, contextEl) {
            var probe = document.createElement('div');
            probe.setAttribute(
                'style',
                'position:absolute;left:-9999px;top:0;width:' +
                    cssLen +
                    ';height:0;overflow:hidden;visibility:hidden;pointer-events:none'
            );
            (contextEl && contextEl.parentNode ? contextEl.parentNode : document.body).appendChild(probe);
            var px = probe.getBoundingClientRect().width;
            probe.remove();
            return px || 1;
        }
        function swPackTilesGrid(grid) {
            var wraps = Array.prototype.slice.call(grid.querySelectorAll(':scope > .sw-tile-wrap'));
            if (!wraps.length) {
                grid.style.gridTemplateColumns = '';
                grid.style.gridAutoFlow = '';
                return;
            }
            var w = grid.clientWidth;
            if (w < 2) return;
            var cs = getComputedStyle(grid);
            var colMinStr = (cs.getPropertyValue('--sw-tile-col-min') || '').trim();
            if (!colMinStr) colMinStr = '7.75rem';
            var colMinPx = swCssWidthToPx(colMinStr, grid);
            var colCount = Math.max(1, Math.floor(w / colMinPx));
            grid.style.gridTemplateColumns = 'repeat(' + colCount + ', minmax(0, 1fr))';
            grid.style.gridAutoFlow = 'row';
            var occ = Object.create(null);
            function occKey(r, c) {
                return r + ',' + c;
            }
            function canPlace(r, c, rowSpan, colSpan) {
                if (c + colSpan > colCount) return false;
                for (var dr = 0; dr < rowSpan; dr++) {
                    for (var dc = 0; dc < colSpan; dc++) {
                        if (occ[occKey(r + dr, c + dc)]) return false;
                    }
                }
                return true;
            }
            function markOcc(r, c, rowSpan, colSpan) {
                for (var dr = 0; dr < rowSpan; dr++) {
                    for (var dc = 0; dc < colSpan; dc++) {
                        occ[occKey(r + dr, c + dc)] = 1;
                    }
                }
            }
            for (var i = 0; i < wraps.length; i++) {
                var wrap = wraps[i];
                wrap.style.gridRow = '';
                wrap.style.gridColumn = '';
                wrap.style.removeProperty('max-width');
                var rowSpan = 1;
                if (
                    wrap.classList.contains('sw-tile-wrap--size-crit') ||
                    wrap.classList.contains('sw-tile-wrap--size-crit-wide')
                ) {
                    rowSpan = 3;
                } else if (
                    wrap.classList.contains('sw-tile-wrap--size-warn') ||
                    wrap.classList.contains('sw-tile-wrap--size-warn-wide')
                ) {
                    rowSpan = 2;
                }
                var colSpan = 1;
                if (wrap.classList.contains('sw-tile-wrap--span-3')) {
                    colSpan = 3;
                } else if (
                    wrap.classList.contains('sw-tile-wrap--size-ok-wide') ||
                    wrap.classList.contains('sw-tile-wrap--size-warn-wide') ||
                    wrap.classList.contains('sw-tile-wrap--size-crit-wide')
                ) {
                    colSpan = 2;
                }
                if (colSpan > colCount) colSpan = colCount;
                var placed = false;
                for (var r = 0; r < 900 && !placed; r++) {
                    for (var c = 0; c <= colCount - colSpan; c++) {
                        if (canPlace(r, c, rowSpan, colSpan)) {
                            wrap.style.gridRow = r + 1 + ' / span ' + rowSpan;
                            wrap.style.gridColumn = c + 1 + ' / span ' + colSpan;
                            markOcc(r, c, rowSpan, colSpan);
                            placed = true;
                            break;
                        }
                    }
                }
            }
        }
        var _swPackWallT = null;
        function swSchedulePackAllWallTileGrids() {
            clearTimeout(_swPackWallT);
            _swPackWallT = setTimeout(function() {
                _swPackWallT = null;
                document.querySelectorAll('.sw-tiles.sw-tiles--region').forEach(function(el) {
                    swPackTilesGrid(el);
                });
            }, 32);
        }
        function swInitWallTilePackResize() {
            if (window._swWallPackResizeInit) return;
            window._swWallPackResizeInit = true;
            var root = document.getElementById('sw-root');
            if (!root) return;
            if (typeof ResizeObserver === 'undefined') {
                window.addEventListener('resize', swSchedulePackAllWallTileGrids);
                return;
            }
            var roT = null;
            var ro = new ResizeObserver(function() {
                clearTimeout(roT);
                roT = setTimeout(swSchedulePackAllWallTileGrids, 48);
            });
            ro.observe(root);
        }
        function appendRegionColumnTiles(colEl, services) {
            const sp = splitServicesBknd(services);
            let hasMainGrid = false;
            if (sp.main.length) {
                const grid = document.createElement('div');
                grid.className = 'sw-tiles sw-tiles--region';
                appendTilesToGrid(grid, sp.main);
                colEl.appendChild(grid);
                hasMainGrid = true;
            }
            if (sp.backend.length) {
                const block = document.createElement('div');
                block.className =
                    'sw-region-backend-block' + (hasMainGrid ? ' sw-region-backend-block--after-main' : '');
                const sh = document.createElement('div');
                sh.className = 'sw-region-subhead';
                sh.textContent = 'Backend';
                block.appendChild(sh);
                const gridB = document.createElement('div');
                gridB.className = 'sw-tiles sw-tiles--region sw-tiles--backend';
                appendTilesToGrid(gridB, sp.backend, { backendSection: true });
                block.appendChild(gridB);
                colEl.appendChild(block);
            }
        }
        function appendTilesToGrid(grid, svcs, opts) {
            opts = opts || {};
            const backendSection = !!opts.backendSection;
            if (!svcs || !svcs.length) {
                const empty = document.createElement('div');
                empty.className = 'sw-meta';
                empty.textContent = 'No services in this column.';
                grid.appendChild(empty);
                return;
            }
            for (const s of svcs) {
                const st = s.status || 'unknown';
                const rawSvc = String(s.service || '');
                const tileLabel = backendSection
                    ? swTileServiceLabelBackendDisplay(rawSvc)
                    : swTileServiceLabel(rawSvc);
                const wrap = document.createElement('div');
                wrap.className = 'sw-tile-wrap';
                const labLen = tileLabel.length;
                if (st === 'critical') {
                    if (labLen > 30) {
                        wrap.classList.add('sw-tile-wrap--span-3', 'sw-tile-wrap--size-crit');
                    } else if (labLen > 17) {
                        wrap.classList.add('sw-tile-wrap--size-crit-wide');
                    } else {
                        wrap.classList.add('sw-tile-wrap--size-crit');
                    }
                } else if (st === 'warning') {
                    if (labLen > 30) {
                        wrap.classList.add('sw-tile-wrap--span-3', 'sw-tile-wrap--size-warn');
                    } else if (labLen > 17) {
                        wrap.classList.add('sw-tile-wrap--size-warn-wide');
                    } else {
                        wrap.classList.add('sw-tile-wrap--size-warn');
                    }
                } else {
                    if (labLen > 30) {
                        wrap.classList.add('sw-tile-wrap--span-3', 'sw-tile-wrap--size-ok');
                    } else if (labLen > 17) {
                        wrap.classList.add('sw-tile-wrap--size-ok-wide');
                    } else {
                        wrap.classList.add('sw-tile-wrap--size-ok');
                    }
                }
                const el = document.createElement('a');
                const apmH = smSafeHttpHref(s.apm_url);
                el.href = apmH || '#';
                el.className = 'sw-tile';
                el.setAttribute('title', nativeTitleSummary(s));
                if (st === 'critical') el.classList.add('sw-tile--crit', 'sw-tile--alert');
                else if (st === 'warning') el.classList.add('sw-tile--warn', 'sw-tile--alert');
                const icon = document.createElement('div');
                icon.className = 'sw-tile-icon';
                icon.textContent = st === 'critical' ? '✕' : st === 'warning' ? '⚠' : '✓';
                el.appendChild(icon);
                const met = document.createElement('div');
                met.className = 'sw-tile-name-compact';
                const nameScroll = document.createElement('div');
                nameScroll.className = 'sw-tile-name-scroll';
                nameScroll.textContent = tileLabel || '—';
                met.appendChild(nameScroll);
                el.appendChild(met);
                appendCritApmTrafficLine(met, s);
                if ((st === 'warning' || st === 'critical') && tileLabel.indexOf('-') !== -1) {
                    const segs = tileLabel.split(/-+/).map(function (p) { return p.trim(); }).filter(Boolean);
                    if (segs.length >= 2) {
                        wrap.classList.add('sw-tile-wrap--hyphen-split');
                        nameScroll.classList.add('sw-tile-name-hyphen-split');
                    }
                }
                appendTileIssueChipsStrip(el, s);
                wrap.appendChild(el);
                wrap.appendChild(buildTileTip(s));
                attachTipBehavior(wrap);
                grid.appendChild(wrap);
            }
        }
        function renderWall(data) {
            const root = document.getElementById('sw-root');
            root.textContent = '';
            const monitors = data.monitors || null;
            for (const g of data.groups || []) {
                const section = document.createElement('section');
                section.className = 'sw-group';
                const head = document.createElement('div');
                head.className = 'sw-group-head';
                const title = document.createElement('div');
                title.className = 'sw-group-title';
                title.textContent = g.label;
                head.appendChild(title);
                appendMonitorPills(head, monitors);
                const pill = document.createElement('span');
                pill.className = 'sw-overall-pill ' + (g.overall || 'healthy');
                pill.textContent = g.overall || 'healthy';
                head.appendChild(pill);
                const c = g.counts || {};
                const badges = document.createElement('div');
                badges.className = 'sw-badges';
                [['✓', c.healthy, 'sw-badge--ok'], ['⚠', c.warning, 'sw-badge--warn'], ['✕', c.critical, 'sw-badge--crit']].forEach(([sym, n, cls]) => {
                    if (!n && sym !== '✓') return;
                    const b = document.createElement('span');
                    b.className = 'sw-badge ' + cls;
                    b.textContent = sym + ' ' + (n != null ? n : 0);
                    badges.appendChild(b);
                });
                head.appendChild(badges);
                section.appendChild(head);
                const regionWrap = document.createElement('div');
                regionWrap.className = 'sw-region-grid';
                const allSvcs = g.services || [];
                const hasAny = allSvcs.length > 0;
                if (!hasAny) {
                    const empty = document.createElement('div');
                    empty.className = 'sw-meta';
                    empty.textContent = 'No services with APM signal in this window (inactive/unknown are hidden on the wall).';
                    regionWrap.appendChild(empty);
                } else {
                    let columns = g.region_columns;
                    if (!columns || !columns.length) columns = buildRegionColumnsFromServices(allSvcs);
                    columns = filterNonEmptyRegionColumns(columns);
                    for (const col of columns) {
                        const colEl = document.createElement('div');
                        colEl.className = 'sw-region-col';
                        const hrow = document.createElement('div');
                        hrow.className = 'sw-region-col-head';
                        const ct = document.createElement('div');
                        ct.className = 'sw-region-col-title';
                        ct.textContent = col.label || '';
                        const ch = document.createElement('span');
                        ch.className = 'sw-region-col-hint';
                        ch.textContent = col.subtitle || '';
                        hrow.appendChild(ct);
                        hrow.appendChild(ch);
                        colEl.appendChild(hrow);
                        appendRegionColumnTiles(colEl, col.services || []);
                        regionWrap.appendChild(colEl);
                    }
                }
                section.appendChild(regionWrap);
                root.appendChild(section);
            }
            bindWallTipGlobalHandlersOnce();
            swInitWallTilePackResize();
            requestAnimationFrame(function() {
                requestAnimationFrame(swSchedulePackAllWallTileGrids);
            });
        }
        renderWall(MOCK);
        document.getElementById('sw-slack').addEventListener('click', function() {
            if (typeof SlackShare === 'undefined') {
                alert('Slack: no se pudo cargar slack_share.js');
                return;
            }
            SlackShare.sendFromSelector('#sw-root', {
                page_title: 'Status wall (preview — datos ficticios)',
            });
        });
    </script>
